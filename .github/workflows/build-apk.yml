name: Build APK

# 触发方式：推送到 main 分支，或在网页上手动点 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter（stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 查看版本
        run: flutter --version

      - name: 生成安卓工程（与当前 Flutter 版本匹配）
        run: flutter create --platforms=android --org com.lhk --project-name bletool .

      - name: 覆盖 Manifest（注入蓝牙权限与应用名）
        run: cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 编译 Debug APK
        run: flutter build apk --debug

      - name: 上传 APK（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: bletool-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
