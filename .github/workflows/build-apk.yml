name: Build APK

# 触发方式：推送到 main 分支，或在网页上手动点 "Run workflow"
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 安装 Flutter（stable）
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 查看版本
        run: flutter --version

      - name: 生成安卓工程（与当前 Flutter 版本匹配）
        run: flutter create --platforms=android --org com.lhk --project-name bletool .

      - name: 覆盖 Manifest（注入蓝牙权限与应用名）
        run: cp ci/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: 拷贝应用图标（mipmap 全套）
        run: |
          for d in ci/icons/mipmap-*; do
            cp -r "$d" android/app/src/main/res/
          done
          ls android/app/src/main/res/

      - name: 提升 compileSdk 至 36（新插件要求）
        run: sed -i 's/flutter.compileSdkVersion/36/g' android/app/build.gradle || true

      - name: 使用仓库内固定 debug.keystore（保证每次 APK 签名一致，可直接覆盖安装）
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - name: 拉取依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze --no-fatal-infos

      - name: 编译 Release APK（全架构，约 30-40MB）
        run: flutter build apk --release

      - name: 编译 Release APK（仅 arm64 单架构，约 15MB）
        run: flutter build apk --release --split-per-abi

      - name: 上传 Release APK（可下载）
        uses: actions/upload-artifact@v4
        with:
          name: bletool-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: 上传 arm64 单架构 APK（更小）
        uses: actions/upload-artifact@v4
        with:
          name: bletool-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
