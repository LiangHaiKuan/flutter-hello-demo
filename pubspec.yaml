name: bletool
description: "BLE 调试助手（Flutter 版）— 供硬件工程师日常调试 BLE 设备"
publish_to: 'none'
version: 1.6.0+16

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_blue_plus: ^1.35.2
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  file_picker: ^10.3.3
  share_plus: ^10.1.2
  ble_peripheral: ^2.4.0
  gbk_codec: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
